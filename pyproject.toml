[project]
name = "rag-platform"
version = "0.1.0"
description = "Production-grade RAG tool with citations, tenancy, evals and guardrails"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "beautifulsoup4==4.15.0",
    "fastapi==0.165.0",
    "fastembed==0.9.1",
    "httpx==0.29.0",
    "mlflow==3.18.0",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "pyjwt==2.15.1",
    "pypdf==7.2.0",
    "rapidfuzz==3.14.6",
    "redis==8.2.0",
    "sqlalchemy==2.1.9",
    "structlog==26.1.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_platform"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs Postgres with pgvector (TEST_DATABASE_URL)",
    "model: needs fastembed models already in the local cache (skips when absent, never downloads)",
]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "hypothesis==6.170.17",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.6",
]
