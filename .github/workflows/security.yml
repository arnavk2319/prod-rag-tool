name: security

on:
  pull_request:
  push:
    branches: [dev, main]
  schedule:
    - cron: "17 6 * * 1" # weekly, catches newly published advisories
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Required check: secrets. Scans the whole history for committed credentials.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Required check: sast. Static analysis for injection, unsafe deserialization, SSRF, XSS and similar.
  sast:
    name: sast (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install "semgrep==1.*"
      - run: >-
          semgrep scan --error --quiet
          --config p/default --config p/python --config p/typescript
          --config p/secrets --config p/owasp-top-ten
          --include '*.py' --include '*.ts' --include '*.tsx'
          .

  # Required check: dependency-audit. Known vulnerabilities in locked dependencies.
  # Steps skip themselves until the lockfiles exist, so the check passes on an empty scaffold.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: pip-audit (locked Python dependencies)
        if: ${{ hashFiles('uv.lock') != '' }}
        run: |
          uv export --frozen --no-hashes --no-emit-project -o /tmp/requirements-audit.txt
          uvx pip-audit --no-deps --disable-pip -r /tmp/requirements-audit.txt
      - name: npm audit (web)
        if: ${{ hashFiles('web/package-lock.json') != '' }}
        working-directory: web
        run: npm audit --audit-level=high
      - name: Nothing to audit yet
        if: ${{ hashFiles('uv.lock') == '' && hashFiles('web/package-lock.json') == '' }}
        run: echo "No lockfiles yet; nothing to audit."

  # Pull requests only: block newly introduced vulnerable dependencies.
  # Needs "Dependency graph" enabled in the repo settings; advisory until then.
  dependency-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Required check: workflow-security. Lints these workflows for injection and over-broad permissions.
  workflow-security:
    name: workflow-security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uvx zizmor --min-severity medium .github
