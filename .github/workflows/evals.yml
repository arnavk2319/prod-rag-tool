name: evals

# PR eval gate, first cut. Uses the deterministic fake provider and no secrets (spec: "PR eval gate").
# The recompute-and-compare-with-dev step and the policy check arrive with the P1 eval ticket.
# The full suite (real Ollama models) runs locally, not here: Actions runners cannot host the models.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  PROVIDER: fake

jobs:
  # Required check: eval-gate. Steps skip themselves until the code exists.
  eval-gate:
    name: eval-gate (smoke, red-team)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway CI database, no password to leak
          POSTGRES_DB: rag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d rag_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/rag_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: uv sync
      - name: Smoke eval
        if: ${{ hashFiles('evals/run.py') != '' }}
        run: uv run python -m evals.run --suite smoke
      - name: Red-team tests
        if: ${{ hashFiles('tests/redteam/**/*.py') != '' }}
        run: uv run pytest -q tests/redteam
      - name: Nothing to evaluate yet
        if: ${{ hashFiles('evals/run.py') == '' }}
        run: echo "No eval runner yet; nothing to evaluate."
