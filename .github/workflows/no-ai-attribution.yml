name: no-ai-attribution

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: no-ai-attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Scan commits, PR title and PR body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pat='co-authored-by:.*(claude|anthropic|copilot|gpt|openai|gemini|cursor|codex|\bai\b|\bbot\b|noreply@anthropic)|generated (with|by) .*(claude|anthropic|copilot|\bai\b)|🤖'
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -Eiq "$pat"; then
            echo "PR title/body contains AI attribution. Remove it." >&2; exit 1
          fi
          if git log --format='%B' "$BASE..$HEAD" | grep -Eiq "$pat"; then
            echo "A commit message contains AI attribution. Reword it." >&2; exit 1
          fi
