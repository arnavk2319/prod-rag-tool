name: ci

on:
  pull_request:
  push:
    branches: [dev, main] # catches semantic conflicts between PRs that were each green on their own
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  UV_FROZEN: "1" # fail if uv.lock is out of date

jobs:
  # Required check: verify. Steps skip themselves until the project scaffold (pyproject.toml) exists.
  # Later tickets split this into lint-types, tests (pgvector + redis services), security-tests and boot-smoke.
  verify:
    name: verify (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Install
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: uv sync
      - name: Lint
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: uv run ruff check .
      - name: Tests
        if: ${{ hashFiles('pyproject.toml') != '' }}
        run: uv run pytest -q
      - name: Nothing to verify yet
        if: ${{ hashFiles('pyproject.toml') == '' }}
        run: echo "No pyproject.toml yet; nothing to verify."
