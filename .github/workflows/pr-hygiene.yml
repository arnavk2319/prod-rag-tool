name: pr-hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Required check: pr-title. Conventional commit style keeps history readable.
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }} # via env: never interpolate untrusted text into a script
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|chore|refactor|test|ci|perf|security|build)(\([a-z0-9._-]+\))?!?: .{3,}'; then
            echo "Title must look like 'feat(retrieval): add hybrid search'. Got: $TITLE"
            echo "Types: feat fix docs chore refactor test ci perf security build"
            exit 1
          fi

  # Required check: forbidden-files. Keeps env files, keys and local agent tooling out of the repo.
  forbidden-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Look for files that must never be committed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=$(git diff --name-only --diff-filter=AM "$BASE...$HEAD" | grep -E '(^|/)(\.env(\..*)?|docs-internal/.*|\.planning/.*|specs/.*|\.claude/.*|AGENTS\.md|CLAUDE\.md|.*\.(pem|key|p12|pfx))$' | grep -Ev '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "These files must not be committed:"; echo "$bad"; exit 1; fi

  # Required check: migration-approval. Database migration changes need a human-applied label.
  migration-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - run: |
          changed=$(git diff --name-only "$BASE...$HEAD" -- migrations/ | grep -vE '(^|/)\.gitkeep$' || true)
          [ -z "$changed" ] && { echo "no migration changes"; exit 0; }
          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx migration-approved; then
            echo "migration-approved label present"; exit 0
          fi
          echo "Migration files changed without the migration-approved label (applied by a human reviewer):"; echo "$changed"; exit 1
